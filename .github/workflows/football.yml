name: Generate Football Animation

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC
  push:
    branches: [main]       # also regenerates on every push
  workflow_dispatch:        # lets you trigger manually from the Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit the generated SVG back to the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate football_contributions.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: python generate_football.py


      - name: Commit and push football_contributions.svg
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add football_contributions.svg
          git diff-index --quiet HEAD || git commit -m "chore: update football animation"
          git push


