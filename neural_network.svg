<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" width="460" height="200">
<defs>
  <filter id="soft-glow" x="-15%" y="-15%" width="130%" height="130%">
    <feGaussianBlur stdDeviation="1.8" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="red-glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <linearGradient id="train-grad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#22c55e" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#22c55e" stop-opacity="0.0"/>
  </linearGradient>
  <linearGradient id="val-grad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f87171" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#f87171" stop-opacity="0.0"/>
  </linearGradient>
  <linearGradient id="panel-bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#161b27"/>
    <stop offset="100%" stop-color="#0d1117"/>
  </linearGradient>

  <style>
    .bg { fill: #0d1117; }
    .panel { fill: url(#panel-bg); stroke: #21262d; stroke-width: 1; }
    .panel-header { fill: #161b27; stroke: #21262d; stroke-width: 0.8; }
    .axis { stroke: #30363d; stroke-width: 0.8; fill: none; }
    .axis-label { font-family: 'Courier New', monospace; font-size: 6px; fill: #484f58; }
    .chart-label { font-family: 'Courier New', monospace; font-size: 7.5px; fill: #94a3b8; font-weight: bold; }
    .title-main { font-family: 'Courier New', monospace; font-size: 9px; fill: #e6edf3; font-weight: bold; letter-spacing: 0.5px; }
    .subtitle { font-family: 'Courier New', monospace; font-size: 6px; fill: #484f58; }
    .metric-val { font-family: 'Courier New', monospace; font-size: 11px; font-weight: bold; }
    .metric-label { font-family: 'Courier New', monospace; font-size: 5.5px; fill: #6e7681; letter-spacing: 0.5px; }
    .quote-text { font-family: 'Courier New', monospace; font-size: 6.5px; fill: #8b949e; font-style: italic; }
    .badge-text { font-family: 'Courier New', monospace; font-size: 8px; font-weight: bold; fill: #0d1117; }
    .badge-sub { font-family: 'Courier New', monospace; font-size: 4.5px; fill: #484f58; }

    /* Training line draws itself */
    @keyframes draw-train {
      0% { stroke-dashoffset: 300; }
      60%, 100% { stroke-dashoffset: 0; }
    }
    .line-train {
      stroke: #22c55e; stroke-width: 1.5; fill: none;
      stroke-dasharray: 300;
      animation: draw-train 4s ease-out infinite;
    }

    /* Validation line draws with a delay then flatlines */
    @keyframes draw-val {
      0%, 15% { stroke-dashoffset: 280; }
      75%, 100% { stroke-dashoffset: 0; }
    }
    .line-val {
      stroke: #f87171; stroke-width: 1.5; fill: none;
      stroke-dasharray: 280;
      animation: draw-val 4s ease-out infinite;
    }

    /* Train metric counter ticks up */
    @keyframes fade-in-metric {
      0%, 10% { opacity: 0; }
      40%, 100% { opacity: 1; }
    }
    .metric-appear { animation: fade-in-metric 4s ease-out infinite; }

    /* Grade badge pop */
    @keyframes badge-pop {
      0%, 50% { transform: scale(0.8); opacity: 0; }
      65% { transform: scale(1.1); opacity: 1; }
      75%, 100% { transform: scale(1.0); opacity: 1; }
    }
    .badge-anim { animation: badge-pop 4s ease-out infinite; transform-origin: 398px 85px; }

    /* Val flatline blink */
    @keyframes flatline-blink {
      0%, 74% { opacity: 0; }
      80%, 88% { opacity: 1; }
      92% { opacity: 0; }
      96%, 100% { opacity: 1; }
    }
    .flatline-tag { animation: flatline-blink 4s ease-out infinite; }

    /* Confetti stars (train celebration) */
    @keyframes star1 {
      0%, 55% { opacity: 0; transform: translate(0,0) rotate(0deg); }
      65% { opacity: 1; transform: translate(-4px,-6px) rotate(45deg); }
      80%, 100% { opacity: 0; transform: translate(-6px,-12px) rotate(90deg); }
    }
    @keyframes star2 {
      0%, 58% { opacity: 0; transform: translate(0,0) rotate(0deg); }
      68% { opacity: 1; transform: translate(5px,-7px) rotate(-30deg); }
      82%, 100% { opacity: 0; transform: translate(7px,-13px) rotate(-60deg); }
    }
    @keyframes star3 {
      0%, 60% { opacity: 0; transform: translate(0,0) scale(0.5); }
      70% { opacity: 1; transform: translate(-2px,-5px) scale(1.2); }
      85%, 100% { opacity: 0; transform: translate(-3px,-10px) scale(0); }
    }
    .star1 { animation: star1 4s ease-out infinite; transform-origin: 175px 40px; }
    .star2 { animation: star2 4s ease-out infinite; transform-origin: 175px 40px; }
    .star3 { animation: star3 4s ease-out infinite; transform-origin: 175px 40px; }

    /* Scanning epoch line */
    @keyframes epoch-scan {
      0% { transform: translateX(0px); opacity: 0.8; }
      90% { transform: translateX(145px); opacity: 0.8; }
      91%, 100% { opacity: 0; }
    }
    .epoch-scan { animation: epoch-scan 4s linear infinite; }
  </style>
</defs>

<!-- Background -->
<rect class="bg" width="460" height="200"/>

<!-- Top header bar -->
<rect x="0" y="0" width="460" height="26" fill="#161b27"/>
<line x1="0" y1="26" x2="460" y2="26" stroke="#21262d" stroke-width="0.8"/>

<!-- Header dots (macOS style) -->
<circle cx="14" cy="13" r="3.5" fill="#ef4444"/>
<circle cx="24" cy="13" r="3.5" fill="#eab308"/>
<circle cx="34" cy="13" r="3.5" fill="#22c55e"/>

<!-- Header title -->
<text class="title-main" x="50" y="17">Model Performance Dashboard</text>
<text class="subtitle" x="230" y="17">epoch: 100/100 | status: TRAINING COMPLETE</text>

<!-- Blinking status dot -->
<circle cx="452" cy="13" r="2.5" fill="#22c55e">
  <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
</circle>

<!-- ─── LEFT CHART: Training Accuracy ─── -->
<rect class="panel" x="10" y="34" width="200" height="110" rx="4"/>
<rect class="panel-header" x="10" y="34" width="200" height="18" rx="4"/>
<rect x="10" y="45" width="200" height="7" rx="0" fill="#161b27"/>
<text class="chart-label" x="18" y="47" fill="#22c55e">TRAIN ACCURACY</text>
<circle cx="192" cy="43" r="2.5" fill="#22c55e" filter="url(#soft-glow)"/>

<!-- Grid lines -->
<line class="axis" x1="30" y1="52" x2="30" y2="136"/>
<line class="axis" x1="30" y1="136" x2="202" y2="136"/>
<line class="axis" stroke-dasharray="2 4" x1="30" y1="95" x2="202" y2="95"/>
<line class="axis" stroke-dasharray="2 4" x1="30" y1="73" x2="202" y2="73"/>

<!-- Y axis labels -->
<text class="axis-label" x="14" y="139">0%</text>
<text class="axis-label" x="14" y="98">50%</text>
<text class="axis-label" x="14" y="76">75%</text>
<text class="axis-label" x="14" y="55">100%</text>

<!-- Shaded area under training curve -->
<polygon fill="url(#train-grad)" fill-opacity="0.4"
  points="30,136 50,120 70,100 90,78 110,65 130,58 150,54 170,52 190,51 202,51 202,136"/>

<!-- Training accuracy line: rockets upward fast then flattens near 99% -->
<polyline class="line-train" filter="url(#soft-glow)"
  points="30,136 50,120 70,100 90,78 110,65 130,58 150,54 170,52 190,51 202,51"/>

<!-- Epoch scanning vertical line -->
<line class="epoch-scan" x1="30" y1="52" x2="30" y2="136" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.25"/>

<!-- Confetti stars at peak -->
<text class="star1" x="168" y="54" font-size="8px" fill="#fbbf24">*</text>
<text class="star2" x="168" y="54" font-size="7px" fill="#22c55e">+</text>
<text class="star3" x="168" y="54" font-size="6px" fill="#60a5fa">*</text>

<!-- Train metric -->
<text class="metric-val metric-appear" x="18" y="158" fill="#22c55e" filter="url(#soft-glow)">99.9%</text>
<text class="metric-label" x="18" y="167">FINAL TRAIN ACC.</text>

<!-- ─── RIGHT CHART: Validation Accuracy ─── -->
<rect class="panel" x="220" y="34" width="200" height="110" rx="4"/>
<rect class="panel-header" x="220" y="34" width="200" height="18" rx="4"/>
<rect x="220" y="45" width="200" height="7" rx="0" fill="#161b27"/>
<text class="chart-label" x="228" y="47" fill="#f87171">VALIDATION ACCURACY</text>
<circle cx="402" cy="43" r="2.5" fill="#f87171" filter="url(#red-glow)"/>

<!-- Grid lines right -->
<line class="axis" x1="240" y1="52" x2="240" y2="136"/>
<line class="axis" x1="240" y1="136" x2="412" y2="136"/>
<line class="axis" stroke-dasharray="2 4" x1="240" y1="95" x2="412" y2="95"/>
<line class="axis" stroke-dasharray="2 4" x1="240" y1="73" x2="412" y2="73"/>

<!-- Y axis labels right -->
<text class="axis-label" x="224" y="139">0%</text>
<text class="axis-label" x="224" y="98">50%</text>
<text class="axis-label" x="224" y="76">75%</text>
<text class="axis-label" x="224" y="55">100%</text>

<!-- Shaded area under val curve -->
<polygon fill="url(#val-grad)" fill-opacity="0.35"
  points="240,136 260,120 280,103 300,96 320,94 340,95 360,95 380,94 400,95 412,95 412,136"/>

<!-- Val line: rises a bit, then flatlines sadly at ~51% -->
<polyline class="line-val" filter="url(#red-glow)"
  points="240,136 260,120 280,103 300,96 320,94 340,95 360,95 380,94 400,95 412,95"/>

<!-- Flatline label -->
<g class="flatline-tag">
  <rect x="340" y="84" width="65" height="12" rx="2" fill="#7f1d1d" stroke="#f87171" stroke-width="0.7"/>
  <text x="344" y="93" font-family="'Courier New',monospace" font-size="6px" fill="#fca5a5">-- FLATLINED AT 51% --</text>
</g>

<!-- Val metric -->
<text class="metric-val metric-appear" x="228" y="158" fill="#f87171" filter="url(#red-glow)">51.2%</text>
<text class="metric-label" x="228" y="167">FINAL VAL. ACC.</text>

<!-- ─── GRADE BADGE ─── -->
<g class="badge-anim">
  <rect x="430" y="155" width="22" height="22" rx="3" fill="#1f6feb" stroke="#388bfd" stroke-width="1"/>
  <text class="badge-text" x="436" y="170" fill="#ffffff">A+</text>
</g>
<text class="badge-sub" x="427" y="183">train only</text>

<!-- ─── BOTTOM QUOTE ─── -->
<line x1="10" y1="174" x2="450" y2="174" stroke="#21262d" stroke-width="0.7"/>
<text class="quote-text" x="230" y="187" text-anchor="middle">
  "My model is 99% accurate. Please ignore the second chart."
</text>

<!-- Legend bottom left -->
<rect x="10" y="174" width="6" height="6" rx="1" fill="#22c55e"/>
<text class="metric-label" x="19" y="180" fill="#6e7681">Train</text>
<rect x="48" y="174" width="6" height="6" rx="1" fill="#f87171"/>
<text class="metric-label" x="57" y="180" fill="#6e7681">Validation</text>

</svg>
