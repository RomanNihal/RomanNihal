    <path d="M98,58 C120,58 120,90 98,90" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <path class="steam-l" d="M35,38 C31,28 38,18 34,6" fill="none" stroke="#fde68a" stroke-width="2" stroke-linecap="round" filter="url(#steam-blur)"/>
    <path class="steam-m" d="M58,38 C54,26 61,15 57,2" fill="none" stroke="#fde68a" stroke-width="2" stroke-linecap="round" filter="url(#steam-blur)"/>
