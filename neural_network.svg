<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" width="460" height="200">
<defs>
  <filter id="eye-glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="2" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="steam-blur" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="1" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- Wall-E Base Body Template -->
  <g id="walle-base">
    <!-- Tracks -->
    <g fill="#1e293b" stroke="#0f172a" stroke-width="1.5">
      <rect x="-30" y="15" width="14" height="35" rx="3"/>
      <line x1="-30" y1="22" x2="-16" y2="22"/><line x1="-30" y1="29" x2="-16" y2="29"/>
      <line x1="-30" y1="36" x2="-16" y2="36"/><line x1="-30" y1="43" x2="-16" y2="43"/>
      <rect x="16" y="15" width="14" height="35" rx="3"/>
      <line x1="16" y1="22" x2="30" y2="22"/><line x1="16" y1="29" x2="30" y2="29"/>
      <line x1="16" y1="36" x2="30" y2="36"/><line x1="16" y1="43" x2="30" y2="43"/>
    </g>
    <!-- Body -->
    <rect x="-22" y="-2" width="44" height="35" rx="3" fill="#d97706" stroke="#78350f" stroke-width="1.5"/>
    <path d="M-22,6 L22,6 L22,-1 Q22,-2 20,-2 L-20,-2 Q-22,-2 -22,-1 Z" fill="#94a3b8" stroke="#78350f" stroke-width="1.5"/>
    <!-- Solar panel -->
    <rect x="2" y="12" width="15" height="10" rx="1" fill="#1e293b"/>
    <rect x="4" y="14" width="11" height="1.5" fill="#f59e0b"/>
    <rect x="4" y="17" width="11" height="1.5" fill="#f59e0b"/>
    <rect x="4" y="20" width="11" height="1.5" fill="#f59e0b"/>
    <!-- Front Details -->
    <rect x="-16" y="12" width="12" height="15" rx="1" fill="#b45309" stroke="#78350f" stroke-width="1"/>
  </g>

  <style>
    /* 15 second loop, 6 states x 2.5s each */
    @keyframes bg-color {
      0%, 15%       { fill: #0d2818; }
      18%, 31%      { fill: #0d1a2e; }
      34%, 48%      { fill: #1e1508; }
      51%, 65%      { fill: #1e0a0a; }
      68%, 81%      { fill: #200505; }
      84%, 98%      { fill: #0d2818; }
      100%          { fill: #0d2818; }
    }
    .scene-bg { animation: bg-color 15s step-end infinite; }

    @keyframes stripe-color {
      0%, 15%       { fill: #14532d; }
      18%, 31%      { fill: #1e3a5f; }
      34%, 48%      { fill: #78350f; }
      51%, 65%      { fill: #7f1d1d; }
      68%, 81%      { fill: #450a0a; }
      84%, 98%      { fill: #14532d; }
      100%          { fill: #14532d; }
    }
    .scene-stripe { animation: stripe-color 15s step-end infinite; }

    /* Slide visibility */
    @keyframes show-s1 { 0%, 16% { opacity: 1; } 17%, 100% { opacity: 0; } }
    @keyframes show-s2 { 0%, 16% { opacity: 0; } 17%, 32% { opacity: 1; } 33%, 100% { opacity: 0; } }
    @keyframes show-s3 { 0%, 32% { opacity: 0; } 33%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes show-s4 { 0%, 49% { opacity: 0; } 50%, 65% { opacity: 1; } 66%, 100% { opacity: 0; } }
    @keyframes show-s5 { 0%, 65% { opacity: 0; } 66%, 82% { opacity: 1; } 83%, 100% { opacity: 0; } }
    @keyframes show-s6 { 0%, 82% { opacity: 0; } 83%, 99% { opacity: 1; } 100% { opacity: 0; } }
    
    .slide-1 { animation: show-s1 15s step-end infinite; }
    .slide-2 { animation: show-s2 15s step-end infinite; }
    .slide-3 { animation: show-s3 15s step-end infinite; }
    .slide-4 { animation: show-s4 15s step-end infinite; }
    .slide-5 { animation: show-s5 15s step-end infinite; }
    .slide-6 { animation: show-s6 15s step-end infinite; }

    /* Coffee steam */
    @keyframes steam-rise {
      0%   { transform: translateY(0px); opacity: 0.9; }
      100% { transform: translateY(-14px); opacity: 0; }
    }
    .steam-l { animation: steam-rise 1.4s ease-out infinite; }
    .steam-m { animation: steam-rise 1.4s ease-out infinite; animation-delay: 0.45s; }
    .steam-r { animation: steam-rise 1.4s ease-out infinite; animation-delay: 0.9s; }

    /* Sweat drop */
    @keyframes sweat-drop {
      0%, 50%   { transform: translateY(0px); opacity: 1; }
      100%      { transform: translateY(8px); opacity: 0; }
    }
    .sweat { animation: sweat-drop 1.2s ease-in infinite; }

    /* Dead X eyes flicker */
    @keyframes x-flicker {
      0%, 85%, 100% { opacity: 1; }
      90%, 95%      { opacity: 0.2; }
    }
    .dead-eyes { animation: x-flicker 1.8s step-end infinite; }

    /* Heart float on coffee slide */
    @keyframes heart-float {
      0%   { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(4px,-18px) scale(0.6); opacity: 0; }
    }
    .heart { animation: heart-float 2s ease-out infinite; }
    .heart2 { animation: heart-float 2s ease-out infinite; animation-delay: 0.8s; }

    .caption    { font-family: 'Courier New', monospace; font-size: 11px; fill: #e2e8f0; }
    .caption-sm { font-family: 'Courier New', monospace; font-size: 9px; fill: #64748b; }
    .time-text  { font-family: 'Courier New', monospace; font-size: 13px; font-weight: bold; }
  </style>
</defs>

<!-- Animated Background -->
<rect class="scene-bg" width="460" height="200"/>
<!-- Left accent stripe -->
<rect class="scene-stripe" x="0" y="0" width="6" height="200"/>

<!-- Top header bar -->
<rect fill="#00000040" x="0" y="0" width="460" height="28"/>
<text font-family="'Courier New',monospace" font-size="7.5px" fill="#374151" x="16" y="18" letter-spacing="1">AI ENGINEER MOOD TRACKER</text>

<!-- TIME LABELS -->
<text class="time-text slide-1" x="420" y="19" text-anchor="end" fill="#4ade80">09:00 AM</text>
<text class="time-text slide-2" x="420" y="19" text-anchor="end" fill="#60a5fa">11:00 AM</text>
<text class="time-text slide-3" x="420" y="19" text-anchor="end" fill="#fbbf24">01:00 PM</text>
<text class="time-text slide-4" x="420" y="19" text-anchor="end" fill="#f97316">03:00 PM</text>
<text class="time-text slide-5" x="420" y="19" text-anchor="end" fill="#f87171">05:00 PM</text>
<text class="time-text slide-6" x="420" y="19" text-anchor="end" fill="#4ade80">05:01 PM</text>

